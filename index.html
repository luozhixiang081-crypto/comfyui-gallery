<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ComfyUI 生图画廊：浏览作品、筛选标签、查看生成参数与复制提示词。">
  <title>ComfyUI 生图画廊</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#gallery">跳到作品</a>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="ComfyUI 生图画廊首页">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13L16 2Z" stroke="currentColor" stroke-width="1.5"/><path d="m10 12 6-3.5 6 3.5v7L16 22.5 10 19v-7Z" fill="currentColor"/><path d="M16 2v6.5M29 22.5 22 19M3 22.5l7-3.5" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>ComfyUI <span class="brand-light">Gallery</span></span>
      </a>
      <span class="version">v2.1</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span aria-hidden="true"></span> 从提示词到作品</p>
        <h1 id="page-title">生成之后，<br>继续创造。</h1>
        <p class="intro-copy">收藏每一次灵感，也保留它诞生的方式。<br class="desktop-break">点开作品，探索提示词与生成参数。</p>
        <span class="intro-index" aria-hidden="true">01—03</span>
      </section>

      <section class="collection" aria-label="作品画廊">
        <label class="search-field" for="gallery-search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="search-label">搜索作品</span>
          <input id="gallery-search" type="search" placeholder="搜索标题、提示词、模型名..." autocomplete="off" aria-controls="gallery">
        </label>
        <div class="collection-toolbar">
          <div class="filters" role="group" aria-label="按标签筛选作品">
            <button class="filter is-active" type="button" data-tag="全部" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-tag="人像" aria-pressed="false">人像</button>
            <button class="filter" type="button" data-tag="风景" aria-pressed="false">风景</button>
            <button class="filter" type="button" data-tag="电商图" aria-pressed="false">电商图</button>
          </div>
          <p class="collection-count" id="count" aria-live="polite">正在加载</p>
        </div>
        <p class="state-message" id="load-state" role="status">正在加载作品…</p>
        <div class="gallery" id="gallery" tabindex="-1" aria-busy="true"></div>
        <noscript><p class="state-message">请开启 JavaScript 以查看画廊。</p></noscript>
      </section>
    </main>

    <footer class="site-footer"><span>灵感有迹可循。</span><span id="footer-count">ComfyUI 画廊</span></footer>
  </div>

  <dialog class="art-dialog" id="art-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <div><p class="detail-eyebrow" id="dialog-id"></p><h2 id="dialog-title">作品详情</h2></div>
      <button class="close-button" type="button" id="close-dialog" aria-label="关闭作品详情" autofocus>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-content">
      <div class="detail-image-wrap"><img id="detail-image" alt="" decoding="async"><p class="state-message" id="detail-image-state" hidden>图片暂不可用，仍可查看提示词和参数。</p></div>
      <div class="detail-info">
        <div class="detail-tags" id="detail-tags"></div>
        <section class="prompt-section" aria-labelledby="positive-label">
          <div class="section-heading"><h3 id="positive-label">正向提示词</h3><button class="copy-button" type="button" data-copy="prompt" aria-label="复制正向提示词">复制</button></div>
          <p class="prompt-text" id="detail-prompt" tabindex="0"></p>
        </section>
        <section class="prompt-section" aria-labelledby="negative-label">
          <div class="section-heading"><h3 id="negative-label">负向提示词</h3><button class="copy-button" type="button" data-copy="negative" aria-label="复制负向提示词">复制</button></div>
          <p class="prompt-text negative-text" id="detail-negative" tabindex="0"></p>
        </section>
        <section class="parameters" aria-labelledby="parameters-label">
          <h3 id="parameters-label">生成参数</h3>
          <dl id="detail-parameters"></dl>
        </section>
        <div class="workflow-section">
          <button class="workflow-button" id="download-workflow" type="button" disabled aria-describedby="workflow-note">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            下载 workflow JSON
          </button>
          <p id="workflow-note" role="status">此图片未附带有效 workflow 元数据。</p>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </dialog>
</body>
</html>
